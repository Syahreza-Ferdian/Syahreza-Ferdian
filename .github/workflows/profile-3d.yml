name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 18 * * *"  # Runs every day at 01:00 WIB (UTC+7)
  workflow_dispatch:       # Allow manual trigger from Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph

    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Syahreza-Ferdian
          SETTING_JSON: |
            {
              "githubUserName": "Syahreza-Ferdian",
              "startForeColor": "#45B3CB",
              "endForeColor": "#6B4DE6",
              "startBackColor": "#0D1117",
              "endBackColor": "#161B22",
              "cornerBackColor": "#0D1117",
              "type": "normal"
            }

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update 3D contribution graph"
          git push
